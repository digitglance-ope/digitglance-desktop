<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DigitGlance Trade</title>
    <!--
      Connectivity gate + branded launch splash for the DigitGlance Trade
      desktop app. On launch it probes for connectivity and, when online,
      redirects to the live app; while it connects it shows the branded
      DigitGlance Trade splash animation (mirrors the mobile app's BrandSplash).
      Offline shows a branded auto-retry screen instead of the WebView's raw
      error page. Artwork is embedded as data URIs so it renders instantly and
      works with no network.
    -->
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #FAFCFC; color: #132533; overflow: hidden;
      }
      .hidden { display: none !important; }

      .splash { display: flex; flex-direction: column; align-items: center; }
      .iconclip {
        width: 132px; height: 149px; border-radius: 34px; overflow: hidden;
        position: relative;
        animation: iconIn .52s cubic-bezier(.2,.8,.2,1.2) both; animation-delay: .06s;
      }
      .iconclip img { width: 132px; height: 149px; display: block; object-fit: contain; }
      .sheen {
        position: absolute; top: -45px; left: 0; width: 55px; height: 238px;
        background: rgba(255,255,255,.55);
        transform: translateX(-125%) skewX(-18deg);
        animation: sheen .76s ease-in-out both; animation-delay: .36s;
      }
      .wordmark {
        width: 210px; height: auto; margin-top: 30px; display: block;
        animation: wmIn .52s cubic-bezier(.2,.7,.2,1) both; animation-delay: .56s;
      }
      .product {
        margin-top: 12px; font-size: 15px; font-weight: 700; letter-spacing: 6px;
        color: #132533;
        animation: schoolIn .44s cubic-bezier(.2,.7,.2,1) both; animation-delay: .9s;
      }
      .dot {
        width: 8px; height: 8px; border-radius: 50%; background: #6EB240;
        margin-top: 40px; opacity: .35;
        animation: pulse 1.24s ease-in-out infinite; animation-delay: 1.15s;
      }
      @keyframes iconIn { from { opacity:0; transform:scale(.86); } to { opacity:1; transform:scale(1); } }
      @keyframes sheen {
        0% { opacity:0; transform:translateX(-125%) skewX(-18deg); }
        15% { opacity:.5; } 85% { opacity:.5; }
        100% { opacity:0; transform:translateX(230%) skewX(-18deg); }
      }
      @keyframes wmIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
      @keyframes schoolIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
      @keyframes pulse { 0%,100% { opacity:.35; transform:scale(1); } 50% { opacity:1; transform:scale(1.5); } }

      .offline { text-align: center; max-width: 400px; padding: 32px; }
      .offline .mark { width: 92px; height: 92px; border-radius: 22px; margin: 0 auto 22px; display: block; }
      .offline p { color: #5b6b6b; font-size: 14px; line-height: 1.6; }
      .offline strong { color: #132533; }
      .offline button {
        margin-top: 22px; border: 0; border-radius: 12px; cursor: pointer;
        background: #0E8383; color: #fff; font-size: 14px; font-weight: 700;
        padding: 11px 22px; font-family: inherit;
      }
      .offline button:hover { background: #0b6d6d; }
      .offline button:disabled { opacity: .6; cursor: default; }

      @media (prefers-reduced-motion: reduce) {
        .iconclip, .sheen, .wordmark, .product, .dot { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>
  </head>

      <p><strong>You're offline.</strong><br />DigitGlance Trade needs an internet
        connection. We'll reconnect automatically as soon as you're back online.</p>
      <button id="retry" type="button">Try again</button>
    </div>

    <script>
      (function () {
        var APP_URL = "https://digitglance.com/app";
        var PROBE_URL = "https://digitglance.com/favicon.ico";
        var MIN_SPLASH_MS = 1800;
        var connectingEl = document.getElementById("connecting");
        var offlineEl = document.getElementById("offline");
        var retryBtn = document.getElementById("retry");
        var retryTimer = null;
        var startedAt = Date.now();

        function showConnecting() { offlineEl.classList.add("hidden"); connectingEl.classList.remove("hidden"); }
        function showOffline() { connectingEl.classList.add("hidden"); offlineEl.classList.remove("hidden"); }

        function isReachable() {
          var controller = new AbortController();
          var t = setTimeout(function () { controller.abort(); }, 6000);
          return fetch(PROBE_URL, { method: "GET", mode: "no-cors", cache: "no-store", signal: controller.signal })
            .then(function () { clearTimeout(t); return true; })
            .catch(function () { clearTimeout(t); return false; });
        }

        function go() {
          var wait = Math.max(0, MIN_SPLASH_MS - (Date.now() - startedAt));
          setTimeout(function () { window.location.replace(APP_URL); }, wait);
        }

        function attempt() {
          showConnecting();
          if (retryBtn) retryBtn.disabled = true;
          isReachable().then(function (ok) {
            if (ok) { go(); }
            else {
              showOffline();
              if (retryBtn) retryBtn.disabled = false;
              clearTimeout(retryTimer);
              retryTimer = setTimeout(attempt, 5000);
            }
          });
        }

        if (retryBtn) {
          retryBtn.addEventListener("click", function () { clearTimeout(retryTimer); startedAt = Date.now(); attempt(); });
        }
        window.addEventListener("online", function () { clearTimeout(retryTimer); startedAt = Date.now(); attempt(); });

        attempt();
      })();
    </script>
