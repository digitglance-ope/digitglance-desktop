<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DigitGlance Trade</title>
    <!--
      Connectivity gate for the DigitGlance TRADE desktop app. The native window
      opens here (a local, always-available page) rather than straight at the
      remote app. On launch it probes for connectivity and, when online,
      redirects to Trade in the live web app. When offline it shows a branded
      screen with auto-retry + a manual retry, instead of the WebView's raw error
      page.
    -->
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f7faf9;
        color: #0f1b1b;
      }
      .wrap { text-align: center; padding: 32px; max-width: 380px; }
      .logo {
        display: block; width: 248px; max-width: 76%; height: auto;
        margin: 0 auto 24px;
      }
      p { margin: 0; color: #5b6b6b; font-size: 14px; line-height: 1.5; }
      .spinner {
        margin: 22px auto 0; width: 26px; height: 26px; border-radius: 50%;
        border: 3px solid #cfeaf6; border-top-color: #009BD5;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      button {
        margin-top: 22px; border: 0; border-radius: 10px; cursor: pointer;
        background: #009BD5; color: #fff; font-size: 14px; font-weight: 600;
        padding: 10px 20px; font-family: inherit;
      }
      button:hover { background: #0086bb; }
      button:disabled { opacity: 0.6; cursor: default; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="logo" src="logo.png" alt="DigitGlance Trade" width="248" />

      <!-- Connecting state -->
      <div id="connecting">
        <p>Connecting to DigitGlance Trade…</p>
        <div class="spinner" role="status" aria-label="Loading"></div>
      </div>

      <!-- Offline state -->
      <div id="offline" class="hidden">
        <p><strong>You're offline.</strong><br />DigitGlance Trade needs an internet
          connection. We'll reconnect automatically as soon as you're back online.</p>
        <button id="retry" type="button">Try again</button>
      </div>
    </div>

    <script>
      (function () {
        // `?client=trade-desktop` tells the web app which product this window
        // was sold as. It is consumed ONCE: middleware validates it against an
        // allowlist, stores it in a cookie and redirects to the clean URL, so
        // the marker never rides in later links. From then on the web app
        // hides cross-product switching and refuses to render Books here.
        //
        // Sent on the launch URL rather than in the User-Agent because Tauri
        // REPLACES the UA instead of appending to it (unlike the mobile
        // WebView), and a hardcoded UA would differ per OS and risk breaking
        // the payment gateways. Keep the value in sync with SHELL_CLIENTS in
        // the platform repo's src/lib/app-shell.ts.
        // /app/dashboard, not bare /app: the latter is not a route and used to
        // 404 for an already-signed-in user on launch. The hub then auto-routes
        // a locked shell straight into its own product, which is also what
        // makes this correct for invoicing-only plans (they must not be sent to
        // a POS-gated surface).
        var APP_URL = "https://digitglance.com/app/dashboard?client=trade-desktop";
        var PROBE_URL = "https://digitglance.com/favicon.ico";
        var connectingEl = document.getElementById("connecting");
        var offlineEl = document.getElementById("offline");
        var retryBtn = document.getElementById("retry");
        var retryTimer = null;

        function showConnecting() {
          offlineEl.classList.add("hidden");
          connectingEl.classList.remove("hidden");
        }
        function showOffline() {
          connectingEl.classList.add("hidden");
          offlineEl.classList.remove("hidden");
        }

        function isReachable() {
          var controller = new AbortController();
          var t = setTimeout(function () { controller.abort(); }, 6000);
          return fetch(PROBE_URL, {
            method: "GET",
            mode: "no-cors",
            cache: "no-store",
            signal: controller.signal,
          })
            .then(function () { clearTimeout(t); return true; })
            .catch(function () { clearTimeout(t); return false; });
        }

        function attempt() {
          showConnecting();
          if (retryBtn) retryBtn.disabled = true;
          isReachable().then(function (ok) {
            if (ok) {
              window.location.replace(APP_URL);
            } else {
              showOffline();
              if (retryBtn) retryBtn.disabled = false;
              clearTimeout(retryTimer);
              retryTimer = setTimeout(attempt, 5000);
            }
          });
        }

        if (retryBtn) {
          retryBtn.addEventListener("click", function () {
            clearTimeout(retryTimer);
            attempt();
          });
        }
        window.addEventListener("online", function () {
          clearTimeout(retryTimer);
          attempt();
        });

        attempt();
      })();
    </script>
  </body>
</html>
