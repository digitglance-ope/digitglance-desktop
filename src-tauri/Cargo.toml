[package]
name = "digitglance"
version = "1.0.2"
description = "DigitGlance — unified desktop app (Invoice, POS & Books)"
authors = ["Digitglance Reliance"]
edition = "2021"
rust-version = "1.77.2"

# The library that main.rs calls into. Keeping the app logic in a lib lets the
# same code target desktop and (later) mobile from one entry point.
[lib]
name = "digitglance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# `store` builds the Microsoft Store (MSIX) flavour: the Store updates the app,
# so the Tauri self-updater is not registered and never runs. Direct-download
# (NSIS) builds leave it off and keep the GitHub updater. See docs/STORE.md.
[features]
store = []
# SQLCipher is ON by default and is the only configuration that may ship: a
# build without it refuses to open a store at runtime (see store/db.rs), so a
# sale can never be written unencrypted. `--no-default-features` exists only so
# the store's logic tests can run on a machine without a native Perl.
# (Unrelated to `store` above, which is the Microsoft Store flavour.)
default = ["sqlcipher"]
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# The bundled till: device HTTP from Rust (the API has no CORS for the Tauri
# origins) and the save dialog / close confirmation.
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Offline till local store (desktop only; see src/store and docs/LOCAL-STORE-API.md).
# SQLite with SQLCipher whole-file encryption; OpenSSL (SQLCipher's crypto) is
# vendored and statically linked so Windows needs no system OpenSSL. Building
# vendored OpenSSL needs a native Perl (Strawberry Perl on Windows: preinstalled
# on GitHub's windows runners; MSYS/Git-Bash perl does NOT work).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = { version = "3.6", features = ["windows-native", "apple-native"] }
uuid = { version = "1.20", features = ["v7"] }
bcrypt = "0.19"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
fs4 = "1.1"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"

# SQLite and bcrypt are slow unoptimised; keep debug/test builds realistic.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
[profile.dev.package.bcrypt]
opt-level = 3
[profile.dev.package.blowfish]
opt-level = 3

[profile.release]
# Smaller, faster-to-ship installers: strip symbols, optimise for size, and
# enable LTO. A thin remote-shell binary doesn't need debug symbols.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
